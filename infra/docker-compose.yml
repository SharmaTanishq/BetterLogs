services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: betterlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: betterlog
      POSTGRES_PASSWORD: betterlog
      POSTGRES_DB: betterlog
    ports:
      - "5433:5432"
    volumes:
      - betterlog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betterlog -d betterlog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  betterlog_pgdata:
